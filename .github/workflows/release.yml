name: release

on:
  push:
    tags: ['v*']

# The jar reaches users as a Release attachment and by no other route. It is deliberately published
# to no Maven repository: a resolvable artifact is one `runtimeOnly` away from shipping inside
# somebody's mod, which is the invariant this whole project is built around. See SECURITY.md.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check security invariants
        run: sh .github/scripts/check_invariants.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes-file .github/release_notes_header.md \
            build/libs/*.jar
