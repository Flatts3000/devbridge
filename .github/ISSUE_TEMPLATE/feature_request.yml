name: Feature request
description: Something the bridge should be able to do and cannot.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        The bar here is deliberately high. This mod is eight classes and ten verbs, and it stays
        useful by staying small. SPEC.md section 8 lists what is out of scope, section 9 records what
        has already been resolved, and section 10 is what is still open.

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, not the feature. What does the loop you are automating look like today?
    validations:
      required: true

  - type: textarea
    id: why-not-cmd
    attributes:
      label: Why can a `cmd` not do this?
      description: >-
        This is the actual scope test. Anything a Minecraft command already does is out of scope by
        design: `cmd` covers it, and every added verb is a thing to maintain forever. Answers that
        pass this bar usually involve the client (the renderer, the window, the options) or the
        lifecycle of the process itself, because those are the things no command can reach.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What the request and reply would look like
      description: Newline-delimited JSON, one request and one reply. Guessing is fine.
      render: json

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I read SPEC.md section 8, and this is not on the out-of-scope list.
          required: true
        - label: >-
            This does not require the socket to be reachable from another machine, or to open
            without `-Ddevbridge.port`. Both are refused on sight; see SECURITY.md.
          required: true
