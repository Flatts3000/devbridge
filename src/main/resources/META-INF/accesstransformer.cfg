# ONE ENTRY, AND IT SHOULD STAY THAT WAY.
#
# KeyboardHandler.keyPress is what a real keypress goes through. GLFW's callback builds a KeyEvent
# and calls it, and everything a key can do follows from there: Escape opening the pause menu, the
# F3 chords, a screen's own key handling, and the dispatch to KeyMapping.set/click that keybinds are
# read from. It is private, so without this the `key` verb could only reach key MAPPINGS - which
# meant it could not open a screen, and therefore could not check anything that lives in one.
#
# An access transformer rather than a mixin because nothing is being changed: the method is called
# exactly as vanilla calls it, with an event built exactly as vanilla builds it. There is no
# behaviour here to get wrong, only a visibility keyword in the way.
public net.minecraft.client.KeyboardHandler keyPress(JILnet/minecraft/client/input/KeyEvent;)V
