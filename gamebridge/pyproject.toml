[project]
name = "gamebridge"
version = "0.1.0"
description = "Drive a running Minecraft dev server over RCON: run commands, read their output, verify the world"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gamebridge = "gamebridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gamebridge"]
