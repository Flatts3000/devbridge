[project]
name = "gamebridge"
version = "0.4.0"
description = "Drive a running Minecraft instance from outside: start it, run commands, take screenshots, verify the world. RCON for a dedicated server, the devbridge mod for singleplayer."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gamebridge = "gamebridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gamebridge"]
